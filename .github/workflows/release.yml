name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing semantic tag to publish; leave empty for artifact only
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
      artifact: ${{ steps.metadata.outputs.artifact }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.publish_tag && format('refs/tags/{0}', inputs.publish_tag) || github.ref }}

      - name: Validate release version
        id: metadata
        shell: bash
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          build_version="$(plutil -extract CFBundleVersion raw Resources/Info.plist)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CFBundleShortVersionString must use semantic X.Y.Z format: $version" >&2
            exit 1
          fi
          if [[ "$build_version" != "$version" ]]; then
            echo "CFBundleVersion ($build_version) must match $version" >&2
            exit 1
          fi

          release_tag=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$PUBLISH_TAG" ]]; then
            release_tag="$PUBLISH_TAG"
          fi
          if [[ -n "$release_tag" ]]; then
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use semantic vX.Y.Z format: $release_tag" >&2
              exit 1
            fi
            if [[ "$release_tag" != "v$version" ]]; then
              echo "Tag $release_tag does not match bundle version v$version" >&2
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "$head_commit" != "$tag_commit" ]]; then
              echo "Checked-out commit $head_commit does not match tag $release_tag ($tag_commit)" >&2
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "archive=MetalMatrix-$version-macOS-universal.zip"
            echo "artifact=MetalMatrix-$version-macOS-universal"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build universal screen saver
        run: ./script/build_saver.sh

      - name: Validate bundle compatibility
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/MetalMatrix.saver"
          executable="$bundle/Contents/MacOS/MetalMatrix"
          test "$(plutil -extract LSMinimumSystemVersion raw "$bundle/Contents/Info.plist")" = "11.0"
          architectures=" $(lipo -archs "$executable") "
          [[ "$architectures" == *" arm64 "* ]]
          [[ "$architectures" == *" x86_64 "* ]]
          for architecture in arm64 x86_64; do
            xcrun vtool -show-build -arch "$architecture" "$executable" |
              grep -Eq '^[[:space:]]*minos[[:space:]]+11\.0$'
          done
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Package screen saver
        id: package
        shell: bash
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent dist/MetalMatrix.saver "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: |
            ${{ steps.metadata.outputs.archive }}
            ${{ steps.metadata.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$ARCHIVE#MetalMatrix $VERSION for macOS" \
              "$ARCHIVE.sha256#SHA-256 checksum" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$ARCHIVE#MetalMatrix $VERSION for macOS" \
              "$ARCHIVE.sha256#SHA-256 checksum" \
              --verify-tag \
              --title "MetalMatrix $VERSION" \
              --generate-notes \
              --notes $'### Compatibility\n\n- macOS 11 Big Sur or later\n- Apple Silicon (arm64) and Intel (x86_64)\n- Ad-hoc signed; not Apple-notarized'
          fi
